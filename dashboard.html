<!doctype html>

<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Studio • StreamTube</title>

  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #172033;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       STUDIO PAGE
    ========================= */

    .studio-page {
      max-width: 1250px;
      margin: 0 auto;
      padding: 35px 25px 60px;
    }

    /* =========================
       TOP TITLE
    ========================= */

    .studio-title {
      background: linear-gradient(135deg, #0757a5, #123b70);
      color: white;
      padding: 30px;
      border-radius: 18px;
      margin-bottom: 22px;
      box-shadow: 0 8px 25px rgba(18, 59, 112, .16);
      position: relative;
      overflow: hidden;
    }

    .studio-title::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .08);
      right: -55px;
      top: -70px;
    }

    .studio-title h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 750;
      position: relative;
      z-index: 1;
    }

    .studio-title p {
  margin: 8px 0 0;
  color: #ff2b2b;
  font-size: 15px;
  font-weight: 600;
}

    /* =========================
       MAIN CARD
    ========================= */

    .studio-card {
      background: #ffffff;
      border: 1px solid #dce5ef;
      border-radius: 17px;
      padding: 28px;
      box-shadow: 0 5px 22px rgba(21, 58, 96, .07);
    }

    /* =========================
       CHANNEL
    ========================= */

    .channel-head {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .channel-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      background: #edf4fc;
      border: 4px solid #1769aa;
      box-shadow: 0 5px 15px rgba(23, 105, 170, .18);
    }

    .channel-info h2 {
      margin: 0 0 7px;
      color: #123b70;
      font-size: 26px;
    }

    .channel-info p {
      margin: 5px 0;
      color: #687789;
      font-size: 14px;
    }

    /* =========================
       BUTTONS
    ========================= */

    .studio-actions {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .studio-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 18px;
      border-radius: 9px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      border: 0;
      cursor: pointer;
      background: #e3262e;
      color: #fff;
      transition: .2s ease;
    }

    .studio-btn:hover {
      background: #c91d25;
      transform: translateY(-1px);
    }

    .studio-btn.secondary {
      background: #1769aa;
      color: #fff;
    }

    .studio-btn.secondary:hover {
      background: #125789;
    }

    /* =========================
       STATS
    ========================= */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 22px;
    }

    .stat-card {
      background: #fff;
      border: 1px solid #dce5ef;
      border-radius: 14px;
      padding: 22px;
      min-height: 115px;
      box-shadow: 0 4px 15px rgba(20, 60, 100, .05);
      position: relative;
      overflow: hidden;
    }

    .stat-card:nth-child(1) {
      border-top: 4px solid #1769aa;
    }

    .stat-card:nth-child(2) {
      border-top: 4px solid #e3262e;
    }

    .stat-card:nth-child(3) {
      border-top: 4px solid #1769aa;
    }

    .stat-card:nth-child(4) {
      border-top: 4px solid #e3262e;
    }

    .stat-card::after {
      content: "";
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #f1f6fb;
      right: -25px;
      bottom: -30px;
    }

    .stat-card span {
      display: block;
      color: #687789;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 9px;
      position: relative;
      z-index: 2;
    }

    .stat-card strong {
      display: block;
      color: #123b70;
      font-size: 28px;
      line-height: 1.2;
      position: relative;
      z-index: 2;
    }

    .comments-total {
      margin-top: 15px;
      color: #687789;
      font-size: 14px;
    }

    /* =========================
       VIDEOS SECTION
    ========================= */

    .videos-card {
      margin-top: 22px;
    }

    .videos-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .videos-title h2 {
      margin: 0;
      color: #123b70;
      font-size: 23px;
    }

    /* =========================
       TABLE
    ========================= */

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #dce5ef;
      border-radius: 13px;
    }

    .studio-table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
    }

    .studio-table th {
      text-align: left;
      padding: 15px 14px;
      background: #1769aa;
      color: #ffffff;
      border-bottom: 1px solid #125789;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .studio-table td {
      padding: 16px 14px;
      border-bottom: 1px solid #e8edf3;
      font-size: 14px;
      color: #333;
      background: #fff;
    }

    .studio-table tr:last-child td {
      border-bottom: 0;
    }

    .studio-table tr:hover td {
      background: #f5f9fd;
    }

    .video-title {
      font-weight: 700;
      color: #123b70;
    }

    .visibility {
      text-transform: capitalize;
      font-size: 13px;
      color: #687789;
    }

    /* =========================
       ACTION BUTTONS
    ========================= */

    .action-buttons {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .watch-btn {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 7px;
      border: 1px solid #1769aa;
      background: #fff;
      color: #1769aa;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      transition: .2s;
    }

    .watch-btn:hover {
      background: #1769aa;
      color: #fff;
    }

    .delete-btn {
      padding: 8px 12px;
      border-radius: 7px;
      border: 0;
      background: #e3262e;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
    }

    .delete-btn:hover {
      background: #c91d25;
    }

    /* =========================
       EMPTY STATE
    ========================= */

    .empty-state {
      text-align: center;
      padding: 55px 20px;
      color: #687789;
    }

    .empty-state strong {
      display: block;
      color: #123b70;
      font-size: 18px;
      margin-bottom: 7px;
    }

    /* =========================
       ERROR
    ========================= */

    .error-box {
      padding: 15px;
      border-radius: 10px;
      background: #fff0f1;
      color: #c51d26;
      border: 1px solid #f2bcc0;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 900px) {

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 650px) {

      .studio-page {
        padding: 22px 12px 35px;
      }

      .studio-title {
        padding: 23px 20px;
        border-radius: 14px;
      }

      .studio-title h1 {
        font-size: 27px;
      }

      .studio-card {
        padding: 18px;
        border-radius: 13px;
      }

      .channel-head {
        align-items: flex-start;
      }

      .channel-avatar {
        width: 72px;
        height: 72px;
      }

      .channel-info h2 {
        font-size: 20px;
      }

      .stats-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .stat-card {
        padding: 16px;
      }

      .stat-card strong {
        font-size: 22px;
      }

      .videos-title {
        align-items: flex-start;
        flex-direction: column;
      }

      .videos-title .studio-btn {
        width: 100%;
      }

    }

    @media (max-width: 420px) {

      .stats-grid {
        grid-template-columns: 1fr;
      }

    }
  </style>

</head>
