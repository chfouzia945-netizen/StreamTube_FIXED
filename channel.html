<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Channel • StreamTube</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <header class="top">

    <a
      class="logo"
      href="index.html"
    >
      StreamTube
    </a>

    <div class="search">

      <input
        id="searchInput"
        placeholder="Search"
        autocomplete="off"
      >

      <button id="searchBtn">
        Search
      </button>

    </div>

    <div
      class="actions"
      id="actions"
    ></div>

  </header>


  <main class="main">

    <section class="panel">

      <div id="channel">

        <div class="muted">
          Loading channel...
        </div>

      </div>

    </section>

  </main>


  <script src="app.js"></script>

  <script src="channel-handler.js"></script>

</body>

</html>
