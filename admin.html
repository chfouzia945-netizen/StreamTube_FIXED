<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • StreamTube</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><a class="logo" href="index.html">StreamTube</a><div class="search"><input id="searchInput" placeholder="Search"><button id="searchBtn">Search</button></div><div class="actions" id="actions"></div></header><main class="main"><section class="panel"><h1>Admin Panel</h1><div id="stats"></div></section><section class="panel" style="margin-top:15px"><h2>Users</h2><div id="users">Loading...</div></section></main><script src="app.js"></script><script>async function loadAdmin(){try{var s=await api('/api/admin/stats'),u=await api('/api/admin/users');document.getElementById('stats').innerHTML='<div class="stats"><div class="stat">Users<b>'+s.users+'</b></div><div class="stat">Videos<b>'+s.videos+'</b></div><div class="stat">Views<b>'+s.views+'</b></div><div class="stat">Comments<b>'+s.comments+'</b></div></div>';document.getElementById('users').innerHTML='<table class="table"><tr><th>ID</th><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>Action</th></tr>'+u.users.map(function(x){return '<tr><td>'+x.id+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.username)+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.role)+'</td><td><button class="btn danger" data-id="'+x.id+'">Delete</button></td></tr>'}).join('')+'</table>';$$('[data-id]').forEach(function(b){b.addEventListener('click',async function(){if(!confirm('Delete user?'))return;try{await api('/api/admin/users/'+b.getAttribute('data-id'),{method:'DELETE'});location.reload()}catch(e){alert(e.message)}})})}catch(e){document.getElementById('stats').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}document.addEventListener('DOMContentLoaded',loadAdmin);</script></body></html>
